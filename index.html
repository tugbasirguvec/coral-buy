<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/index.css" />
    <title>Coral Buy</title>
  </head>
  <body>
    <div class="top-main">
      <header>
        <div class="top-header">
          <div class="search">
            <img src="images/search-icon.svg" alt="search-icon" />
          </div>
          <div class="logo">
            <img src="images/logo.svg" alt="logo" />
          </div>
          <div class="user">
            <div class="account">
              <img src="images/account-icon.svg" alt="account-icon" />
              <p>Account</p>
            </div>
            <div class="shopping">
              <img src="images/shopping-icon.svg" alt="shopping-icon" />
              <p>Shopping</p>
            </div>
          </div>
        </div>
        <svg width="400" height="200" xmlns="http://www.w3.org/2000/svg">
          <line
            x1="0"
            y1="50"
            x2="300"
            y2="50"
            style="stroke: #000; stroke-width: 2"
          />
        </svg>
      </header>
    </div>
  </body>
</html>
