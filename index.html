<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/index.css" />
    <title>Coral Buy</title>
  </head>
  <body>
    <div class="top-main">
      <header>
        <div class="top-header">
          <div class="search">
            <img src="images/search-icon.svg" alt="search-icon" />
          </div>
          <div class="logo">
            <img src="images/logo.svg" alt="logo" />
          </div>
          <div class="user">
            <div class="account">
              <img src="images/account-icon.svg" alt="account-icon" />
              <p>Account</p>
            </div>
            <div class="shopping">
              <img src="images/shopping-icon.svg" alt="shopping-icon" />
              <p>Shopping</p>
            </div>
          </div>
        </div>
        <hr
          style="
            border: 1px solid rgba(227, 227, 227, 1);
            width: 100%;
            margin: 20px auto;
          "
        />
        <div class="menu">
          <div class="jewelry-accessories">
            <p>Jewelry & Accessories</p>
          </div>
          <div class="clothing-shoes">
            <p>Clothing & Shoes</p>
          </div>
          <div class="home-living">
            <p>Home & Living</p>
          </div>
          <div class="wedding-party">
            <p>Wedding & Party</p>
          </div>
          <div class="toys-entertainment">
            <p>Toys & Entertainment</p>
          </div>
          <div class="art-collectibles">
            <p>Art & Collectibles</p>
          </div>
          <div class="craft-supplies-tools">
            <p>Craft Supplies & Tools</p>
          </div>
        </div>
      </header>
    </div>
  </body>
</html>
