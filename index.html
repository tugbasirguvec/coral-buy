<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
      rel="stylesheet"
    />

    <title>Coral Buy</title>
  </head>
  <body>
    <div class="top-main">
      <header>
        <div class="top-header">
          <div class="search">
            <img src="images/search-icon.svg" alt="search-icon" />
          </div>
          <div class="logo">
            <img src="images/logo.svg" alt="logo" />
          </div>
          <div class="user">
            <div class="account">
              <img src="images/account-icon.svg" alt="account-icon" />
              <p>Account</p>
            </div>
            <div class="shopping">
              <img src="images/shopping-icon.svg" alt="shopping-icon" />
              <p>Shopping</p>
            </div>
          </div>
        </div>
        <hr
          style="
            border: 1px solid rgba(227, 227, 227, 1);
            width: 100%;
            margin: 20px auto;
          "
        />
        <div class="menu">
          <div class="jewelry-accessories">
            <p>Jewelry & Accessories</p>
          </div>
          <div class="clothing-shoes">
            <p>Clothing & Shoes</p>
          </div>
          <div class="home-living">
            <p>Home & Living</p>
          </div>
          <div class="wedding-party">
            <p>Wedding & Party</p>
          </div>
          <div class="toys-entertainment">
            <p>Toys & Entertainment</p>
          </div>
          <div class="art-collectibles">
            <p>Art & Collectibles</p>
          </div>
          <div class="craft-supplies-tools">
            <p>Craft Supplies & Tools</p>
          </div>
        </div>
      </header>
      <div class="product">
        <div class="content">
          <h1 class="content-title">Collections</h1>
          <p class="content-paragraf">
            You Can Explore And Shop Many Different Collection From Various
            Brands Here.
          </p>
          <div class="shop-now-button">
            <img
              class=".shop-now-btn .shop-icon"
              src="images/shopping-icon-white.svg"
              alt="shopping-icon-white"
            />
            <button class="shop-now-content">Shop Now</button>
          </div>
        </div>
        <div class="image-product">
          <img src="images/woman-model.png" alt="woman-model" />
          <rect class="rectangle" />
        </div>
      </div>
    </div>
  </body>
</html>
